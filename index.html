<!DOCTYPE html>
<html class="staticrypt-html" dir="rtl" lang="he">
    <head>
        <meta charset="utf-8" />
        <title>המסלול נעול</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
        <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

        <style>
            :root {
                --ink: #1c2430;
                --rust: #b8452b;
                --rust-soft: #c0553b;
                --muted: #717171;
                --field: #f5f2ef;
            }

            .staticrypt-html { height: 100%; }

            .staticrypt-body { height: 100%; margin: 0; }

            .staticrypt-content {
                height: 100%;
                margin: 0;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #1c2430;
                font-family: "Assistant", system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: var(--ink);
            }
            .staticrypt-content::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(120% 120% at 15% 0%, #2b3a4a 0%, #1c2430 55%, #141c26 100%);
            }

            .staticrypt-page {
                position: relative;
                z-index: 1;
                width: 380px;
                max-width: calc(100% - 40px);
                padding: 20px 0;
                box-sizing: border-box;
            }

            .staticrypt-form {
                background: #ffffff;
                border-radius: 18px;
                padding: 40px 38px 34px;
                text-align: center;
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
            }

            .staticrypt-kicker {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-size: 13px;
                font-weight: 700;
                letter-spacing: .02em;
                color: var(--rust-soft);
                margin-bottom: 14px;
            }
            .staticrypt-kicker .dot {
                width: 7px; height: 7px; border-radius: 50%;
                background: var(--rust-soft);
            }

            .staticrypt-title {
                font-size: 26px;
                font-weight: 800;
                letter-spacing: -.02em;
                margin: 0 0 8px;
                color: var(--ink);
            }

            .staticrypt-instructions {
                margin: 0 0 22px;
                font-size: 15px;
                line-height: 1.55;
                color: var(--muted);
            }

            .staticrypt-password-container {
                position: relative;
                background: var(--field);
                border-radius: 12px;
                width: 100%;
                margin: 0 0 14px;
                box-sizing: border-box;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-family: inherit;
                font-size: 16px;
                outline: 0;
                padding: 15px 18px 15px 46px;
                width: 100%;
                color: var(--ink);
                text-align: right;
            }
            .staticrypt-form input::placeholder { color: #a99f97; }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                width: 20px;
                opacity: .5;
                padding: 13px;
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 4px 2px 20px;
                font-size: 14.5px;
                color: var(--muted);
                cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] {
                width: 17px; height: 17px;
                accent-color: var(--rust);
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: inherit;
                outline: 0;
                background: var(--rust);
                width: 100%;
                border: 0;
                border-radius: 12px;
                padding: 15px;
                color: #ffffff;
                font-size: 16px;
                font-weight: 700;
                cursor: pointer;
                transition: filter .15s ease, transform .15s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(94%); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(1px); }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #1c2430;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem; height: 2rem;
                border: 0.25em solid rgba(255,255,255,.25);
                border-right-color: #b8452b;
                border-radius: 50%;
                animation: staticrypt-spin 0.75s linear infinite;
            }
            @keyframes staticrypt-spin { 100% { transform: rotate(360deg); } }
        </style>
    </head>
