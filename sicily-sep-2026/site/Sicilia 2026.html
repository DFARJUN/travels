<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סיציליה 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --bg:#ffffff; --paper:#faf6f0; --card:#ffffff;
    --ink:#1c2430; --muted:#5f6b78; --line:#e8e1d6;
    --rust:#b8452b; --rust-d:#9a3820; --rust-soft:#f4e5df;
    --green:#3d7a55; --gold:#c58a2a;
    --shadow:0 14px 34px -18px rgba(28,36,48,.30);
    --f:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
    --maxw:1080px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,28px)}
  h1,h2,h3{line-height:1.15;font-weight:800;letter-spacing:-.01em}
  .en{unicode-bidi:isolate}
  a{color:var(--rust)}
  section{padding:clamp(40px,6vw,72px) 0}
  .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
  .sec-head h2{font-size:clamp(23px,3.6vw,34px)}
  .sec-head .rule{flex:1;height:2px;background:var(--rust-soft)}
  .kick{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--rust);margin-bottom:6px}

  /* hero */
  .hero{position:relative;min-height:min(78vh,640px);display:flex;align-items:flex-end;color:#fff;overflow:hidden}
  .hero .slot{position:absolute;inset:0}
  .hero .slot .img{width:100%;height:100%}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,26,34,.15) 0%,rgba(20,26,34,.05) 40%,rgba(20,26,34,.72) 100%);z-index:1;pointer-events:none}
  .hero-in{position:relative;z-index:2;width:100%;padding-bottom:clamp(26px,5vw,52px)}
  .hero h1{font-size:clamp(38px,8vw,80px);font-weight:800;text-shadow:0 2px 24px rgba(0,0,0,.35)}
  .hero .sub{font-size:clamp(15px,2.2vw,20px);max-width:44ch;margin-top:6px;color:#f3ede2}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
  .chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(5px);padding:7px 14px;border-radius:100px;font-size:14px;font-weight:600}

  /* image-slot */
  .slot{position:relative;overflow:hidden;background:var(--paper)}
  .slot .img{width:100%;height:100%;background-size:cover;background-position:center;transition:transform .5s ease}
  .slot:hover .img{transform:scale(1.03)}
  .slot .credit{position:absolute;bottom:6px;inset-inline-start:8px;font-size:10px;color:rgba(255,255,255,.9);background:rgba(0,0,0,.42);padding:2px 7px;border-radius:6px;text-decoration:none;z-index:3}
  .slot.drag{outline:3px dashed var(--rust);outline-offset:-6px}
  .slot .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;background:rgba(28,36,48,.45);opacity:0;transition:opacity .2s;z-index:2;text-align:center;padding:10px;cursor:pointer}
  .slot:hover .hint{opacity:1}

  /* map */
  #map{height:clamp(360px,52vw,520px);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);z-index:1}
  .map-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(12px,2vw,18px)}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
  .legend .li{display:flex;align-items:center;gap:7px}
  .dot{width:13px;height:13px;border-radius:50%;flex:none}
  .num-marker{color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35);font-family:var(--f)}
  .map-reset{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;font-family:var(--f);font-weight:700;font-size:12.5px;padding:6px 10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .map-reset:hover{border-color:var(--rust);color:var(--rust)}
  .leaflet-container{font-family:var(--f)}
  .pop b{font-size:15px;color:var(--ink)}
  .pop span{color:var(--muted);font-size:12.5px}

  /* days timeline */
  .tl{position:relative}
  .tl::before{content:"";position:absolute;inset-inline-start:20px;top:10px;bottom:10px;width:2px;background:var(--line)}
  .day{position:relative;padding-inline-start:56px;padding-bottom:22px;scroll-margin-top:20px}
  .day:last-child{padding-bottom:0}
  .day .node{position:absolute;inset-inline-start:10px;top:6px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--rust);z-index:2}
  .day.embark .node,.day.disembark .node{border-color:var(--green)}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;transition:box-shadow .2s,transform .2s,border-color .2s;cursor:pointer}
  .dcard:hover{box-shadow:var(--shadow);border-color:var(--rust);transform:translateX(-2px)}
  .dcard.flash{animation:flash 1.4s ease}
  @keyframes flash{0%{box-shadow:0 0 0 0 var(--rust-soft)}30%{box-shadow:0 0 0 6px var(--rust-soft);border-color:var(--rust)}100%{box-shadow:0 0 0 0 transparent}}
  .dtop{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:4px}
  .kindbadge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:100px;background:var(--rust-soft);color:var(--rust-d)}
  .day.embark .kindbadge,.day.disembark .kindbadge{background:#e2efe7;color:var(--green)}
  .dlabel{font-weight:700;font-size:12px;color:var(--muted)}
  .dcard h3{font-size:19px;flex:1;min-width:160px}
  .dmeta{font-size:13.5px;color:var(--muted);margin-bottom:8px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:600;color:var(--rust-d);background:var(--rust-soft);padding:2px 9px;border-radius:6px}
  .blocks{list-style:none;display:flex;flex-direction:column;gap:6px}
  .blocks li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:14.5px;align-items:start}
  .blocks .when{font-weight:700;font-size:11.5px;color:var(--rust);padding-top:3px}
  .dnote{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}

  /* bases */
  .bases{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .base{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .base .slot{aspect-ratio:4/3}
  .base .body{padding:13px 15px 16px}
  .base .body h3{font-size:18px}
  .base .n{font-size:12px;font-weight:700;color:var(--rust);margin:2px 0 6px}
  .base .body p{font-size:13.5px;color:var(--muted)}

  /* highlights */
  .hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .hcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
  .hcard .ic{font-size:30px;margin-bottom:8px}
  .hcard h3{font-size:18px;margin-bottom:4px}
  .hcard p{font-size:14px;color:var(--muted)}

  /* notes */
  .notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .note{background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--rust);border-radius:12px;padding:14px 16px}
  .note b{display:block;margin-bottom:3px}
  .note span{font-size:14px;color:var(--muted)}

  /* lists / checklists */
  .lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start}
  .list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .lhead{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .lhead .ic{font-size:22px}
  .lhead h3{font-size:19px}
  .lhead .cnt{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--muted);background:var(--paper);padding:3px 10px;border-radius:100px;direction:ltr}
  .lsub{font-size:13px;color:var(--muted);margin-bottom:12px}
  .checks{list-style:none;display:grid;gap:10px}
  .checks li{display:flex;gap:11px;align-items:flex-start;cursor:pointer;font-size:14.5px}
  .checks .box{flex:none;width:21px;height:21px;border-radius:6px;border:2px solid var(--rust);margin-top:2px;position:relative;transition:background .15s}
  .checks li.done .box{background:var(--rust)}
  .checks li.done .box::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
  .checks li.done .t{color:var(--muted);text-decoration:line-through}

  /* bookings */
  .bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .bkg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .bkg h3{font-size:18px;margin-bottom:12px;color:var(--rust-d)}
  .bkrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .bkrow:first-of-type{border-top:none}
  .bkrow .t b{font-size:14.5px;font-weight:700}
  .bkrow .t span{font-size:13px;color:var(--muted)}
  .bkrow .when{font-size:12.5px;font-weight:700;color:var(--rust);white-space:nowrap;direction:ltr}

  footer{background:var(--paper);border-top:1px solid var(--line);padding:40px 0;text-align:center;color:var(--muted)}
  footer .fm{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:.08em}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--rust);color:#fff;border:none;font-family:var(--f);font-weight:700;font-size:15px;padding:11px 20px;border-radius:100px;cursor:pointer}
  .btn:hover{background:var(--rust-d)}
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="slot" id="hero-slot"></div>
  <div class="hero-in wrap">
    <div id="hero-text"></div>
  </div>
</header>

<div class="wrap">
  <section id="map-sec">
    <div class="sec-head reveal"><h2>המסלול על המפה</h2><span class="rule"></span></div>
    <div class="map-card">
      <div id="map"></div>
      <div class="legend">
        <div class="li"><span class="dot" style="background:var(--green)"></span> התחלה / סיום</div>
        <div class="li"><span class="dot" style="background:var(--rust)"></span> עצירות המסלול</div>
        <div class="li" style="color:var(--muted);font-weight:500;margin-inline-start:auto">לחיצה על סיכה ← קפיצה ליום</div>
      </div>
    </div>
  </section>

  <section id="days-sec">
    <div class="sec-head reveal"><h2>יום־יום</h2><span class="rule"></span></div>
    <div class="tl reveal" id="days"></div>
  </section>

  <section id="bases-sec">
    <div class="sec-head reveal"><h2>בסיסי הלינה</h2><span class="rule"></span></div>
    <div class="bases reveal" id="bases"></div>
  </section>

  <section id="hl-sec">
    <div class="sec-head reveal"><h2>נקודות שיא</h2><span class="rule"></span></div>
    <div class="hl reveal" id="highlights"></div>
  </section>

  <section id="notes-sec">
    <div class="sec-head reveal"><h2>טוב לדעת</h2><span class="rule"></span></div>
    <div class="notes reveal" id="notes"></div>
  </section>

  <section id="lists-sec">
    <div class="sec-head reveal"><h2>רשימות</h2><span class="rule"></span></div>
    <div class="lists reveal" id="lists"></div>
  </section>

  <section id="bk-sec">
    <div class="sec-head reveal"><h2>הזמנות</h2><span class="rule"></span></div>
    <div class="bk reveal" id="bookings"></div>
  </section>
</div>

<footer>
  <div class="wrap">
    <div style="margin-bottom:16px"><button class="btn" onclick="window.print()">🖨️ שמור / הדפס PDF</button></div>
    <div class="fm" id="foot-title"></div>
    <p style="margin-top:6px" id="foot-sub"></p>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script id="engine">
(function(){
  const NS = (TRIP.id||'trip')+':';
  const LS = {
    get:(k,d)=>{try{const v=localStorage.getItem(NS+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
    set:(k,v)=>{try{localStorage.setItem(NS+k,JSON.stringify(v));}catch(e){}}
  };

  /* image-slot: Wikimedia src, drag/click to replace, persists in localStorage */
  function imageSlot(slotId, src, credit, href){
    const wrap=document.createElement('div'); wrap.className='slot'; wrap.style.height='100%';
    const img=document.createElement('div'); img.className='img'; wrap.appendChild(img);
    const stored=LS.get('img:'+slotId,null);
    const setBg=u=>img.style.backgroundImage=`url("${u}")`;
    setBg(stored||src);
    if(credit && !stored){
      const c=document.createElement('a'); c.className='credit'; c.textContent='📷 '+credit;
      c.href=href||'#'; c.target='_blank'; c.rel='noopener'; wrap.appendChild(c);
    }
    const hint=document.createElement('div'); hint.className='hint'; hint.textContent='גררו תמונה לכאן או לחצו להחליף'; wrap.appendChild(hint);
    const file=document.createElement('input'); file.type='file'; file.accept='image/*'; file.style.display='none'; wrap.appendChild(file);
    const load=f=>{const r=new FileReader();r.onload=e=>{setBg(e.target.result);LS.set('img:'+slotId,e.target.result);const cr=wrap.querySelector('.credit');if(cr)cr.remove();};r.readAsDataURL(f);};
    wrap.addEventListener('click',()=>file.click());
    file.addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0]);});
    wrap.addEventListener('dragover',e=>{e.preventDefault();wrap.classList.add('drag');});
    wrap.addEventListener('dragleave',()=>wrap.classList.remove('drag'));
    wrap.addEventListener('drop',e=>{e.preventDefault();wrap.classList.remove('drag');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0]);});
    return wrap;
  }

  /* hero */
  document.getElementById('hero-slot').appendChild(imageSlot('hero',TRIP.heroImg,TRIP.heroCredit,TRIP.heroCreditHref));
  document.getElementById('hero-text').innerHTML =
    (TRIP.kicker?`<div class="kick" style="color:#ffdcc9">${TRIP.kicker}</div>`:'')+
    `<h1>${TRIP.title}</h1><p class="sub">${TRIP.subtitle||''}</p>`+
    `<div class="chips">${(TRIP.chips||[]).map(c=>`<span class="chip">${c}</span>`).join('')}</div>`;
  document.getElementById('foot-title').textContent=TRIP.title;
  document.getElementById('foot-sub').textContent=TRIP.footer||'';
  document.title=TRIP.title;

  /* days */
  const daysEl=document.getElementById('days');
  DAYS.forEach(d=>{
    const blocks=(d.blocks||[]).map(b=>`<li><span class="when">${b.when}</span><span>${b.text}</span></li>`).join('');
    const tags=(d.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
    const kindTxt={embark:'התחלה',port:'עצירה',disembark:'סיום'}[d.kind]||'';
    const card=document.createElement('div');
    card.className='day '+(d.kind||'port'); card.id='day-'+d.id;
    card.innerHTML=`<div class="node"></div><div class="dcard">
      <div class="dtop">${kindTxt?`<span class="kindbadge">${kindTxt}</span>`:''}<h3>${d.title}</h3><span class="dlabel">${d.dateLabel||''}</span></div>
      ${d.meta?`<div class="dmeta">${d.meta}</div>`:''}
      ${tags?`<div class="tags">${tags}</div>`:''}
      <ul class="blocks">${blocks}</ul>
      ${d.note?`<div class="dnote">${d.note}</div>`:''}</div>`;
    daysEl.appendChild(card);
    if(d.lat&&d.lng) card.querySelector('.dcard').addEventListener('click',()=>focusPin(d.id));
  });

  /* map */
  const pts=DAYS.filter(d=>d.lat&&d.lng);
  const map=L.map('map',{scrollWheelZoom:false}).setView([37.6,14.4],7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',maxZoom:19}).addTo(map);
  const markers={}; const bounds=[];
  pts.forEach(d=>{
    const col=(d.kind==='embark'||d.kind==='disembark')?getVar('--green'):getVar('--rust');
    const icon=L.divIcon({className:'',html:`<div class="num-marker" style="background:${col};width:30px;height:30px">${d.label||''}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
    const m=L.marker([d.lat,d.lng],{icon}).addTo(map);
    m.bindPopup(`<div class="pop"><b>${d.title}</b><br><span>${d.place||''} · ${d.dateLabel||''}</span></div>`);
    m.on('click',()=>{const c=document.querySelector('#day-'+d.id+' .dcard');if(c)flash(c);});
    markers[d.id]=m; bounds.push([d.lat,d.lng]);
  });
  function allBounds(){if(bounds.length)map.fitBounds(bounds,{padding:[45,45]});}
  allBounds();
  const straight=()=>L.polyline(bounds,{color:getVar('--rust'),weight:3,opacity:.8,dashArray:'1 7',lineCap:'round'}).addTo(map);
  const coordStr=pts.map(d=>d.lng+','+d.lat).join(';');
  fetch(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`)
    .then(r=>r.json()).then(j=>{
      if(j&&j.routes&&j.routes[0]){L.polyline(j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]),{color:getVar('--rust'),weight:3.5,opacity:.85,lineCap:'round'}).addTo(map);}
      else straight();
    }).catch(straight);
  window.focusPin=function(id){
    document.getElementById('map-sec').scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>{map.invalidateSize();if(markers[id])markers[id].openPopup();const c=document.querySelector('#day-'+id+' .dcard');if(c)flash(c);},480);
  };
  const Reset=L.Control.extend({options:{position:'topright'},onAdd:function(){const b=L.DomUtil.create('button','map-reset');b.type='button';b.innerHTML='⤢ כל המסלול';L.DomEvent.on(b,'click',e=>{L.DomEvent.stop(e);map.closePopup();allBounds();});return b;}});
  map.addControl(new Reset());

  /* bases */
  const basesEl=document.getElementById('bases');
  BASES.forEach(b=>{
    const el=document.createElement('div'); el.className='base';
    const slot=document.createElement('div'); slot.className='slot';
    slot.appendChild(imageSlot(b.slotId,b.img,b.credit,b.creditHref));
    el.appendChild(slot);
    const body=document.createElement('div'); body.className='body';
    body.innerHTML=`<h3>${b.name}</h3><div class="n">${b.nights} · ${b.dates}</div><p>${b.covers}</p>`;
    el.appendChild(body); basesEl.appendChild(el);
  });

  /* highlights */
  document.getElementById('highlights').innerHTML=(HIGHLIGHTS||[]).map(h=>
    `<div class="hcard"><div class="ic">${h.icon||''}</div><h3>${h.title}</h3><p>${h.text}</p></div>`).join('');

  /* notes */
  document.getElementById('notes').innerHTML=(NOTES||[]).map(n=>
    `<div class="note"><b>${n.label}</b><span>${n.text}</span></div>`).join('');

  /* lists (checklists, persisted) */
  const listsEl=document.getElementById('lists');
  (LISTS||[]).forEach(list=>{
    const panel=document.createElement('div'); panel.className='list';
    const state=LS.get('chk:'+list.id,{});
    panel.innerHTML=`<div class="lhead"><span class="ic">${list.icon||''}</span><h3>${list.title}</h3><span class="cnt"></span></div>${list.sub?`<div class="lsub">${list.sub}</div>`:''}<ul class="checks"></ul>`;
    const ul=panel.querySelector('.checks'), cnt=panel.querySelector('.cnt');
    const upd=()=>cnt.textContent=ul.querySelectorAll('li.done').length+' / '+list.items.length;
    list.items.forEach((t,i)=>{
      const li=document.createElement('li'); if(state[i])li.classList.add('done');
      li.innerHTML=`<span class="box"></span><span class="t">${t}</span>`;
      li.addEventListener('click',()=>{li.classList.toggle('done');state[i]=li.classList.contains('done');LS.set('chk:'+list.id,state);upd();});
      ul.appendChild(li);
    });
    upd(); listsEl.appendChild(panel);
  });

  /* bookings */
  document.getElementById('bookings').innerHTML=(BOOKINGS||[]).map(g=>
    `<div class="bkg"><h3>${g.title}</h3>${g.rows.map(r=>
      `<div class="bkrow"><div class="t"><b>${r.title}</b>${r.detail?`<br><span>${r.detail}</span>`:''}</div><div class="when">${r.when||''}</div></div>`).join('')}</div>`).join('');

  /* helpers */
  function getVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
  function flash(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');}
  const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  const mio=new IntersectionObserver((es,ob)=>es.forEach(e=>{if(e.isIntersecting){map.invalidateSize();allBounds();ob.unobserve(e.target);}}),{threshold:.01});
  mio.observe(document.getElementById('map'));
})();
</script>
</body>
</html>
